<!DOCTYPE html>
<html>
<head>
    <title>Draggable and Droppable Example</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- jQuery UI CDN -->
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>

    <style>
        #draggable {
            width: 120px;
            height: 80px;
            background-color: lightblue;
            text-align: center;
            line-height: 80px;
            cursor: move;
            margin: 20px;
        }

        #droppable {
            width: 250px;
            height: 150px;
            background-color: lightgray;
            border: 2px dashed black;
            text-align: center;
            line-height: 150px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h2>Drag and Drop Example</h2>

    <!-- Draggable element -->
    <div id="draggable">
        Drag me!
    </div>

    <!-- Droppable area -->
    <div id="droppable">
        Drop here!
    </div>

    <script>
        $(document).ready(function() {

            // Make the element draggable
            $("#draggable").draggable();

            // Make the area droppable
            $("#droppable").droppable({

                drop: function(event, ui) {

                    $(this)
                        .css("background-color", "lightgreen")
                        .text("Dropped successfully!");

                }

            });

        });
    </script>

</body>
</html>
