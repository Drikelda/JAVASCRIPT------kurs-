<!DOCTYPE html>
<html>
<head>
    <title>Array Functions</title>
</head>
<body>

    <h2>Array Functions in JavaScript</h2>

    <script>
        // Create an array with five numbers
        let numbers = [10, 20, 30, 40, 50];

        // 1. Add a number to the end
        numbers.push(60);

        // 2. Remove the first number
        numbers.shift();

        // 3. Add a new number at the second position
        numbers.splice(1, 0, 15);

        // 4. Display the modified array
        console.log(numbers);
    </script>

</body>
</html>
